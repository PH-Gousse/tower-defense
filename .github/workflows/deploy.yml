name: Build and deploy

# Premise 2 of the design doc: a browser game with no deployed URL does not
# exist. This runs from step 1 so the URL exists before the game does.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy mid-flight; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Determinism is premise 3 of the design doc: two machines run the same
  # simulation in parallel and must stay bit-identical. Node and headless Chrome
  # are BOTH V8 and would test one engine while claiming two, so the second
  # target has to be genuinely different. Bun runs JavaScriptCore.
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Determinism guards (arithmetic + ordering)
        run: pnpm lint
      - name: Sim tests on V8 (node)
        run: pnpm --filter @ltw/sim test
      - name: Client driver tests (headless — no WebGL needed)
        run: pnpm --filter @ltw/client test
      - name: Relay logic (rooms, handshake, validation)
        # The Durable Object adapter is not covered here -- it needs a Worker
        # runtime. `pnpm --filter @ltw/harness live` exercises that against
        # `wrangler dev`, and is run by hand.
        run: pnpm --filter @ltw/server test
      - name: Bot ladder and match resolution (harness)
        # These run whole bot-vs-bot matches. The ladder test is the one that
        # matters: it has caught the difficulty presets being ordered backwards
        # twice, and neither time was visible by reading the bot.
        run: pnpm --filter @ltw/harness test

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Golden fixture on JavaScriptCore (bun)
        # Same committed command log, same expected hash, different engine. If
        # these two disagree, the arithmetic allowlist has a hole in it.
        run: bun run scripts/golden-jsc.ts

  build:
    needs: sim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm build` runs `tsc --noEmit` before vite, so a type error fails the
      # build rather than shipping. isolatedModules is on in tsconfig.base.json,
      # which is what catches `const enum` — see the design doc, Input schema.
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: packages/client/dist

  deploy:
    # Only main deploys; pull requests stop after a successful build.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
